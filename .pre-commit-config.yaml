repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0  # Use the latest stable version
    hooks:
      - id: trailing-whitespace  # Remove trailing whitespace
      - id: end-of-file-fixer    # Ensure files end with a single newline
      - id: check-yaml           # Validate YAML syntax
      - id: check-json           # Validate JSON syntax
      - id: detect-private-key   # Prevent committing private keys
      - id: check-executables-have-shebangs  # Ensure scripts have shebangs if executable
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
  -   repo: https://github.com/shellcheck-py/shellcheck-py
      rev: v0.10.0.1
      hooks:
      -   id: shellcheck
          exclude: \.fish$|\.zsh$  # Exclude files with .fish or .sh extensions
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.8.0
    hooks:
      - id: black
        # It is recommended to specify the latest version of Python
        # supported by your project here, or alternatively use
        # pre-commit's default_language_version, see
        # https://pre-commit.com/#top_level-default_language_version
        language_version: python3.12
